services:
  postgres:
    image: 'postgres:18'
    restart: always
    environment:
      POSTGRES_DB: ${RANKER_POSTGRES_DB}
      POSTGRES_USER: ${RANKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RANKER_POSTGRES_PASSWORD}
      TZ: ${TIMEZONE:-UTC}
    ports:
      - ${RANKER_POSTGRES_PORT}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    driver: local
